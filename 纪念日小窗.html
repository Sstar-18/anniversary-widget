<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>在一起 · 纪念日小窗</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='8' fill='%23a9443c'/><rect x='10' y='10' width='44' height='44' fill='none' stroke='%23f3ece1' stroke-width='3'/><text x='32' y='44' font-size='26' font-family='serif' fill='%23f3ece1' text-anchor='middle'>日</text></svg>">
<style>
/* ========== 基础 ========== */
:root{
  --paper:#f4ede2; --paper-deep:#ece1d1; --ink:#232019; --ink-2:#5f574c; --ink-3:#8d8478;
  --hair:rgba(35,32,25,.13); --cinnabar:#a9443c; --gold:#9c7a45;
  --spring:#6d8f5c; --summer:#a9443c; --autumn:#a5762f; --winter:#4b6377;
  --accent:var(--autumn);
  --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--paper);}
body{
  color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(120% 90% at 50% 0%, #fbf6ee 0%, var(--paper) 42%, var(--paper-deep) 100%);
  min-height:100vh;
}
.grain{
  position:fixed;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:multiply;z-index:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='150' height='150' filter='url(%23n)' opacity='0.16'/></svg>");
}

/* ========== 版面 ========== */
.sheet{position:relative;z-index:1;width:100%;max-width:1140px;margin:0 auto;padding:26px 20px 30px;}
.grid{display:grid;grid-template-columns:1fr;gap:24px;}

/* 宽屏：整页变成桌面上的一张纸，居中放置 */
@media (min-width:880px){
  body{display:grid;place-items:center;padding:34px 24px;}
  .sheet{
    max-width:1020px;margin:0;padding:46px 52px 42px;
    background:linear-gradient(178deg,#fcf8f1 0%,#f5eee1 100%);
    border:1px solid rgba(35,32,25,.11);border-radius:2px;
    box-shadow:0 34px 64px -38px rgba(70,52,34,.45),0 1px 0 rgba(255,255,255,.85) inset;
  }
  .grid{
    grid-template-columns:1.06fr .94fr;
    grid-template-areas:"hero next" "hero list" "terms terms";
    column-gap:56px;row-gap:22px;
  }
  .hero-cell{grid-area:hero;align-self:start;}
  .next-cell{grid-area:next;}
  .list-cell{grid-area:list;}
  .terms-cell{grid-area:terms;margin-top:10px;padding-top:16px;border-top:1px solid var(--hair);}
}

/* ========== 顶栏 ========== */
.topbar{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--hair);margin-bottom:22px;}
.tl{display:flex;align-items:baseline;gap:14px;min-width:0;}
.dateline{font-size:13.5px;color:var(--ink-2);letter-spacing:.06em;white-space:nowrap;}
.dateline b{font-weight:600;color:var(--ink);}
.today-term{
  font-family:var(--serif);font-size:13px;color:var(--accent);letter-spacing:.14em;white-space:nowrap;
  padding-left:14px;border-left:1px solid var(--hair);
}
.gear{
  appearance:none;border:0;background:none;cursor:pointer;color:var(--ink-3);
  width:30px;height:30px;display:grid;place-items:center;border-radius:50%;
  transition:color .18s, background .18s;flex:none;
}
.gear:hover{color:var(--ink);background:rgba(35,32,25,.05);}
.gear svg{width:17px;height:17px;}

/* ========== 主视觉 ========== */
.hero{position:relative;padding:4px 0 18px;}
.stamp{
  position:absolute;right:4px;top:2px;writing-mode:vertical-rl;
  font-family:var(--serif);font-size:15px;letter-spacing:.18em;
  color:var(--paper);background:var(--cinnabar);padding:9px 6px;
  border-radius:3px;line-height:1.1;transform:rotate(-2deg);
  box-shadow:0 2px 0 rgba(169,68,60,.18);opacity:.92;
}
.eyebrow{font-size:12.5px;letter-spacing:.34em;color:var(--ink-3);text-transform:none;}
.days-row{display:flex;align-items:flex-end;gap:12px;margin-top:10px;}
.days{
  font-family:var(--serif);font-weight:500;color:var(--ink);
  font-size:clamp(72px,15vw,146px);line-height:.84;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum";
}
.unit{font-family:var(--serif);font-size:22px;color:var(--ink-2);padding-bottom:10px;letter-spacing:.1em;}
.hero-sub{margin-top:26px;font-size:14.5px;color:var(--ink-2);letter-spacing:.02em;line-height:1.9;}
.hero-sub em{font-style:normal;font-family:var(--serif);color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;}
.clock{margin-top:2px;font-size:13px;color:var(--ink-3);letter-spacing:.12em;font-variant-numeric:tabular-nums;}
.clock span{color:var(--ink-2);}
.foot{margin-top:14px;font-size:12.5px;color:var(--ink-3);letter-spacing:.04em;}

/* ========== 下一件事 ========== */
.next{
  border:1px solid var(--hair);border-radius:2px;padding:20px 18px 16px;background:rgba(255,255,255,.34);
  position:relative;
}
.next::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent);opacity:.85;}
.next .cap{font-size:11.5px;letter-spacing:.36em;color:var(--ink-3);}
.next-name{font-family:var(--serif);font-size:20px;margin-top:10px;letter-spacing:.08em;}
.next-count{display:flex;align-items:baseline;gap:8px;margin-top:6px;}
.next-num{font-family:var(--serif);font-size:clamp(38px,7vw,52px);line-height:1;font-variant-numeric:tabular-nums;color:var(--accent);}
.next-unit{font-size:14px;color:var(--ink-2);letter-spacing:.12em;}
.next-meta{margin-top:10px;font-size:12.5px;color:var(--ink-3);letter-spacing:.04em;}

/* ========== 清单 ========== */
.list{display:flex;flex-direction:column;}
.list-head{font-size:11.5px;letter-spacing:.36em;color:var(--ink-3);padding-bottom:10px;}
.row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--hair);}
.row:last-child{border-bottom:0;}
.row-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.55;flex:none;}
.row-main{flex:1;min-width:0;}
.row-name{font-family:var(--serif);font-size:15.5px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-date{font-size:12px;color:var(--ink-3);margin-top:3px;letter-spacing:.03em;}
.row-num{font-family:var(--serif);font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink);}
.row-num small{font-size:11.5px;color:var(--ink-3);margin-left:3px;font-family:var(--sans);}
.row-num.today{color:var(--cinnabar);font-size:15px;}

/* ========== 节气刻度 ========== */
.terms{padding-top:8px;}
.terms-cap{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--ink-3);letter-spacing:.24em;margin-bottom:10px;}
.dots{display:flex;align-items:flex-end;gap:3px;height:30px;}
.dot{flex:1;height:14px;border-radius:1px;opacity:.12;transition:height .3s, opacity .3s;}
.dot.past{opacity:.46;}
.dot.now{opacity:1;height:26px;}
.scale{display:flex;margin-top:7px;}
.scale span{flex:1;font-size:11.5px;color:var(--ink-3);letter-spacing:.2em;}
.term-foot{margin-top:9px;font-size:12.5px;color:var(--ink-2);letter-spacing:.03em;}
.term-foot b{font-weight:600;color:var(--accent);font-family:var(--serif);letter-spacing:.08em;}

/* ========== 设置面板 ========== */
.mask{position:fixed;inset:0;background:rgba(30,26,21,.42);backdrop-filter:blur(2px);z-index:40;display:none;align-items:center;justify-content:center;padding:20px;}
.mask.on{display:flex;}
.panel{width:100%;max-width:400px;max-height:88vh;overflow:auto;background:var(--paper);border-radius:3px;padding:22px;box-shadow:0 24px 60px rgba(30,24,18,.28);}
.panel h2{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.1em;}
.panel p.tip{font-size:12px;color:var(--ink-3);margin-top:6px;line-height:1.7;}
.field{margin-top:14px;}
.field label{display:block;font-size:12px;color:var(--ink-2);letter-spacing:.1em;margin-bottom:5px;}
.field input{
  width:100%;padding:9px 10px;font-size:14px;font-family:var(--sans);color:var(--ink);
  background:rgba(255,255,255,.6);border:1px solid var(--hair);border-radius:2px;outline:none;
}
.field input:focus{border-color:var(--accent);}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.extra-list{margin-top:8px;}
.extra-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
.extra-row input{padding:7px 8px;font-size:13px;}
.extra-row input[name="ename"]{flex:1;min-width:0;}
.extra-row input[name="edate"]{width:118px;flex:none;}
.del{appearance:none;border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:13px;padding:4px 6px;}
.del:hover{color:var(--cinnabar);}
.actions{display:flex;gap:10px;margin-top:20px;}
.btn{
  appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--paper);
  font-size:13.5px;letter-spacing:.14em;padding:10px 20px;cursor:pointer;border-radius:2px;font-family:var(--sans);
}
.btn:hover{background:#3a342b;}
.btn.ghost{background:none;color:var(--ink-2);border-color:var(--hair);}
.btn.ghost:hover{background:rgba(35,32,25,.05);}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:14px;line-height:1.8;}

/* 窄屏 / 桌面小窗：收紧节奏，一屏放得下 */
@media (max-width:560px){
  .sheet{padding:16px 15px 20px;}
  .grid{gap:16px;}
  .topbar{padding-bottom:10px;margin-bottom:14px;}
  .dateline,.today-term{font-size:13.5px;}
  .hero{padding:2px 0 8px;}
  .stamp{font-size:13px;padding:7px 5px;}
  .days{font-size:clamp(58px,18vw,88px);}
  .unit{font-size:18px;padding-bottom:6px;}
  .hero-sub{margin-top:14px;font-size:14px;}
  .clock{font-size:13px;}
  .foot{margin-top:10px;font-size:12.5px;}
  .next{padding:14px 13px 12px;}
  .next .cap{font-size:11.5px;}
  .next-name{font-size:18px;margin-top:7px;}
  .next-num{font-size:44px;}
  .next-meta{margin-top:7px;font-size:12.5px;}
  .list-head{padding-bottom:8px;font-size:11.5px;}
  .row{padding:10px 2px;}
  .row-name{font-size:15px;}
  .row-date{font-size:12.5px;margin-top:2px;}
  .row-num{font-size:18px;}
  .terms{padding-top:4px;}
  .dots{height:26px;}
  .dot.now{height:22px;}
  .scale span{font-size:11px;}
  .term-foot{margin-top:6px;font-size:12px;}
  .terms-cap{margin-bottom:8px;}
  .field input,.extra-row input{font-size:16px;}
}
</style>
</head>
<body>
<div class="grain"></div>

<div class="sheet">
  <div class="topbar">
    <div class="tl">
      <div class="dateline" id="dateline"><b>十一月六日</b> · 星期五</div>
      <div class="today-term" id="todayTerm">立冬</div>
    </div>
    <button class="gear" id="gear" aria-label="设置" title="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <circle cx="12" cy="12" r="3.4"/><path d="M12 3.2v2.4M12 18.4v2.4M3.2 12h2.4M18.4 12h2.4M5.9 5.9l1.7 1.7M16.4 16.4l1.7 1.7M18.1 5.9l-1.7 1.7M7.6 16.4l-1.7 1.7"/>
      </svg>
    </button>
  </div>

  <div class="grid">
    <section class="hero-cell hero">
      <div class="stamp">相守</div>
      <div class="eyebrow">在一起</div>
      <div class="days-row">
        <div class="days" id="days">—</div>
        <div class="unit">天</div>
      </div>
      <div class="hero-sub" id="breakdown">正在计算</div>
      <div class="clock" id="clock"></div>
      <div class="foot" id="since"></div>
    </section>

    <section class="next-cell next">
      <div class="cap">下一件事</div>
      <div class="next-name" id="nextName">—</div>
      <div class="next-count">
        <div class="next-num" id="nextNum">—</div>
        <div class="next-unit" id="nextUnit">天</div>
      </div>
      <div class="next-meta" id="nextMeta"></div>
    </section>

    <section class="list-cell list">
      <div class="list-head">往后数</div>
      <div id="rows"></div>
    </section>

    <section class="terms-cell terms">
      <div class="terms-cap"><span>二十四节气</span><span id="termIndex"></span></div>
      <div class="dots" id="dots"></div>
      <div class="scale"><span>春</span><span>夏</span><span>秋</span><span>冬</span></div>
      <div class="term-foot" id="termFoot"></div>
    </section>
  </div>
</div>

<div class="mask" id="mask">
  <div class="panel" role="dialog" aria-modal="true" aria-label="设置">
    <h2 id="panelTitle">谁和谁 · 从哪天起</h2>
    <div class="two">
      <div class="field"><label>你的名字</label><input id="inA" maxlength="8" autocomplete="off"></div>
      <div class="field"><label>TA 的名字</label><input id="inB" maxlength="8" autocomplete="off"></div>
    </div>
    <div class="field"><label>在一起的第一天</label><input id="inDate" type="date"></div>
    <div class="field"><label>当天几点（可留空）</label><input id="inTime" type="time"></div>
    <div class="field">
      <label>额外的纪念日（每年重复）</label>
      <div class="extra-list" id="extraList"></div>
      <button class="del" id="addExtra" style="border:1px dashed var(--hair);padding:7px 12px;width:100%;border-radius:2px;">+ 再加一条</button>
    </div>
    <div class="actions">
      <button class="btn" id="save">存下</button>
      <button class="btn ghost" id="cancel">先不改</button>
    </div>
    <p class="hint">数据只存在这台设备的浏览器里，不会上传。换电脑或换浏览器要重新填一次。</p>
  </div>
</div>

<script>
(function () {
  "use strict";

      });
    }

    // 节气刻度
    var dots = $("dots");
    if (!dots.childElementCount) {
      for (var i = 0; i < 24; i++) {
        var el = document.createElement("div");
        el.className = "dot";
        el.title = ORDER[i];
        el.style.background = SEASON_COLOR[SEASON[ORDER[i]]];
        dots.appendChild(el);
      }
    }
    var idx = ORDER.indexOf(ct.name);
    Array.prototype.forEach.call(dots.children, function (el, i) {
      el.className = "dot" + (i === idx ? " now" : i < idx ? " past" : "");
    });
    $("termIndex").textContent = "第 " + (idx + 1) + " / 24";

    var nt = nextTerm(now);
    if (nt) {
      var gap = dayDiff(now, nt.date);
      $("termFoot").innerHTML =
        "现在 <b>" + ct.name + "</b>　距 " + nt.name + " 还有 " +
        (gap === 0 ? "不到一天" : group(gap) + " 天") +
        "（" + (nt.date.getMonth() + 1) + "月" + nt.date.getDate() + "日 " + fmtTime(nt.date) + "）";
    }

    tickSeconds();
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function tickSeconds() {
    var now = new Date();
    var secs = Math.floor((now - startStamp()) / 1000);
    if (secs < 0) secs = 0;
    $("clock").innerHTML = "每一秒都在加一 · <span>" + group(secs) + "</span> 秒";
  }

  /* ===== 设置面板 ===== */
  function openPanel() {
    $("inA").value = state.a;
    $("inB").value = state.b;
    $("inDate").value = state.start;
    $("inTime").value = state.startTime || "";
    renderExtras(state.extras);
    $("mask").classList.add("on");
    setTimeout(function () { $("inDate").focus(); }, 60);
  }

  function renderExtras(list) {
    var box = $("extraList");
    box.innerHTML = "";
    (list.length ? list : []).forEach(function (e, i) {
      var row = document.createElement("div");
      row.className = "extra-row";
      row.innerHTML =
        '<input name="ename" maxlength="10" placeholder="名字，如 情人节" value="' + esc(e.name || "") + '">' +
        '<input name="edate" maxlength="5" placeholder="02-14" value="' + pad(e.m) + "-" + pad(e.d) + '">' +
        '<button class="del" data-i="' + i + '" title="删掉">×</button>';
      box.appendChild(row);
    });
    box.onclick = function (ev) {
      var t = ev.target;
      if (t && t.classList && t.classList.contains("del")) {
        var i = +t.getAttribute("data-i");
        var cur = readExtras();
        cur.splice(i, 1);
        renderExtras(cur);
      }
    };
  }

  function readExtras() {
    var rows = $("extraList").querySelectorAll(".extra-row");
    var out = [];
    Array.prototype.forEach.call(rows, function (r) {
      var nm = r.querySelector('[name="ename"]').value.trim();
      var dt = r.querySelector('[name="edate"]').value.trim();
      var mm = dt.match(/(\d{1,2})\s*[.\-/月]\s*(\d{1,2})/);
      if (!nm || !mm) return;
      var m = +mm[1], d = +mm[2];
      if (m >= 1 && m <= 12 && d >= 1 && d <= 31) out.push({ name: nm, m: m, d: d });
    });
    return out;
  }

  function closePanel() { $("mask").classList.remove("on"); }

  $("gear").addEventListener("click", openPanel);
  $("cancel").addEventListener("click", closePanel);
  $("mask").addEventListener("click", function (e) { if (e.target === $("mask")) closePanel(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closePanel(); });

  $("addExtra").addEventListener("click", function () {
    var cur = readExtras();
    cur.push({ name: "生日", m: 4, d: 18 });
    renderExtras(cur);
  });

  $("save").addEventListener("click", function () {
    var d = $("inDate").value;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) { $("inDate").focus(); return; }
    state.a = $("inA").value.trim() || "我";
    state.b = $("inB").value.trim() || "TA";
    state.start = d;
    state.startTime = $("inTime").value || "";
    state.extras = readExtras();
    state.saved = true;
    persist(state);
    closePanel();
    render();
  });

  /* ===== 启动 ===== */
  var lastDay = new Date().toDateString();
  render();
  setInterval(function () {
    var now = new Date();
    tickSeconds();
    if (now.toDateString() !== lastDay) { lastDay = now.toDateString(); render(); }
  }, 1000);
})();

</script>
</body>
</html>
